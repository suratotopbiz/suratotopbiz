<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Surat OTOP Biz</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .stat-card {
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-gradient-to-r from-slate-800 to-slate-900 text-white shadow-xl">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-xl flex items-center justify-center mr-3 p-1.5">
                        <img src="assets/logo/logo_suratotopbiz_w.png" 
                             alt="Logo" 
                             class="w-full h-full object-contain">
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Surat OTOP Biz</h1>
                        <p class="text-sm text-slate-300">Admin Dashboard</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button onclick="AdminDashboard.refresh()" class="p-2 hover:bg-white hover:bg-opacity-20 rounded-lg transition" title="รีเฟรช">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                    <div class="text-right hidden sm:block">
                        <div class="text-xs text-slate-300">ผู้ดูแลระบบ</div>
                        <div class="font-medium" id="admin-name">Admin</div>
                    </div>
                    <button onclick="AdminDashboard.logout()" class="p-2 hover:bg-red-500 rounded-lg transition" title="ออกจากระบบ">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- Stats Overview -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-6 h-6 mr-2 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                สถิติภาพรวม
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Total Users -->
                <div class="stat-card bg-white rounded-xl p-6 shadow-lg">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mb-1">ผู้ใช้ทั้งหมด</p>
                    <p class="text-3xl font-bold text-gray-800" id="total-users">0</p>
                    <p class="text-xs text-gray-400 mt-2">
                        <span class="text-green-600" id="active-users">0</span> ใช้งานอยู่
                    </p>
                </div>

                <!-- Total Transactions -->
                <div class="stat-card bg-white rounded-xl p-6 shadow-lg">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl flex items-center justify-center">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mb-1">รายการทั้งหมด</p>
                    <p class="text-3xl font-bold text-gray-800" id="total-transactions">0</p>
                    <p class="text-xs text-gray-400 mt-2">บันทึกในระบบ</p>
                </div>

                <!-- Total Products -->
                <div class="stat-card bg-white rounded-xl p-6 shadow-lg">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mb-1">สินค้าทั้งหมด</p>
                    <p class="text-3xl font-bold text-gray-800" id="total-products">0</p>
                    <p class="text-xs text-gray-400 mt-2">คำนวณต้นทุนแล้ว</p>
                </div>

                <!-- Total Revenue -->
                <div class="stat-card bg-white rounded-xl p-6 shadow-lg">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-amber-500 to-amber-600 rounded-xl flex items-center justify-center">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mb-1">ยอดรวม (เดือนนี้)</p>
                    <p class="text-3xl font-bold text-gray-800" id="total-revenue">฿0</p>
                    <p class="text-xs text-gray-400 mt-2">
                        รายรับ-รายจ่าย
                    </p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-6 h-6 mr-2 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                เมนูจัดการ
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="AdminDashboard.showUsers()" class="bg-white rounded-xl p-6 shadow-lg hover:shadow-xl transition group">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                        </div>
                        <span class="font-medium text-gray-800">จัดการผู้ใช้</span>
                    </div>
                </button>

                <button onclick="AdminDashboard.showTransactions()" class="bg-white rounded-xl p-6 shadow-lg hover:shadow-xl transition group">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                        </div>
                        <span class="font-medium text-gray-800">รายการทั้งหมด</span>
                    </div>
                </button>

                <button onclick="AdminDashboard.showProducts()" class="bg-white rounded-xl p-6 shadow-lg hover:shadow-xl transition group">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                        </div>
                        <span class="font-medium text-gray-800">สินค้าทั้งหมด</span>
                    </div>
                </button>

                <button onclick="AdminDashboard.manageNews()" class="bg-white rounded-xl p-6 shadow-lg hover:shadow-xl transition group">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-14 h-14 bg-gradient-to-br from-amber-500 to-amber-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path>
                            </svg>
                        </div>
                        <span class="font-medium text-gray-800">จัดการข่าวสาร</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Recent Users -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        ผู้ใช้ล่าสุด
                    </h3>
                    <button onclick="AdminDashboard.showUsers()" class="text-sm text-blue-600 hover:text-blue-700">
                        ดูทั้งหมด →
                    </button>
                </div>
                <div id="recent-users" class="space-y-3">
                    <div class="text-center py-8 text-gray-400">
                        <p>กำลังโหลด...</p>
                    </div>
                </div>
            </div>

            <!-- Recent Transactions -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        รายการล่าสุด
                    </h3>
                    <button onclick="AdminDashboard.showTransactions()" class="text-sm text-emerald-600 hover:text-emerald-700">
                        ดูทั้งหมด →
                    </button>
                </div>
                <div id="recent-transactions" class="space-y-3">
                    <div class="text-center py-8 text-gray-400">
                        <p>กำลังโหลด...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-8 flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-700 mb-4"></div>
            <p class="text-gray-600">กำลังโหลด...</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const AdminDashboard = {
            data: {
                admin: null,
                stats: {
                    totalUsers: 0,
                    activeUsers: 0,
                    totalTransactions: 0,
                    totalProducts: 0,
                    totalRevenue: 0
                },
                recentUsers: [],
                recentTransactions: []
            },

            async init() {
                try {
                    // เช็ค Authentication
                    const adminData = localStorage.getItem('surat_otop_admin');
                    if (!adminData) {
                        window.location.href = 'admin.html';
                        return;
                    }

                    this.data.admin = JSON.parse(adminData);
                    this.renderAdminInfo();

                    // โหลดข้อมูล
                    await this.loadData();
                } catch (error) {
                    console.error('❌ Init error:', error);
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            },

            renderAdminInfo() {
                const admin = this.data.admin;
                const nameEl = document.getElementById('admin-name');
                if (nameEl && admin) {
                    nameEl.textContent = admin.username || 'Admin';
                }
            },

            async loadData() {
                this.showLoading();
                try {
                    // TODO: เรียก API เพื่อโหลดข้อมูล
                    // สำหรับตอนนี้ใช้ข้อมูลทดสอบ
                    await this.loadStats();
                    await this.loadRecentUsers();
                    await this.loadRecentTransactions();
                } catch (error) {
                    console.error('❌ Load data error:', error);
                } finally {
                    this.hideLoading();
                }
            },

            async loadStats() {
                try {
                    const admin = this.data.admin;
                    const result = await API.getAdminStats(admin.adminId);
        
                    if (result.success && result.data) {
                        this.data.stats = result.data;
                        this.renderStats();
                    }
            
                } catch (error) {
                    console.error('❌ Load stats error:', error);
                }
            },

            async loadRecentUsers() {
                try {
                    const admin = this.data.admin;
                    const result = await API.getAdminUsers(admin.adminId, 5);
        
                    if (result.success && result.data) {
                        this.data.recentUsers = result.data;
                        this.renderRecentUsers();
                    }
                } catch (error) {
                    console.error('❌ Load users error:', error);
                }
            },

            renderRecentTransactions() {
                const container = document.getElementById('recent-transactions');
                const transactions = this.data.recentTransactions;

                if (!transactions || transactions.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-gray-400"><p>ยังไม่มีรายการ</p></div>';
                    return;
                }

                container.innerHTML = transactions.map(tx => {
                    const isIncome = tx.type === 'income';
                    return `
                        <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg transition">
                            <div class="flex items-center flex-1">
                                <div class="w-10 h-10 rounded-lg flex items-center justify-center mr-3 ${
                                    isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'
                                }">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        ${isIncome 
                                            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"></path>'
                                            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"></path>'
                                        }
                                    </svg>
                                </div>
                                <div>
                                    <div class="font-medium text-gray-800">${tx.category}</div>
                                    <div class="text-xs text-gray-500">${tx.userId}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold ${isIncome ? 'text-emerald-600' : 'text-red-600'}">
                                    ${isIncome ? '+' : '-'}฿${tx.amount.toLocaleString('th-TH')}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            showUsers() {
                alert('ฟีเจอร์ "จัดการผู้ใช้" กำลังพัฒนา\n\nจะเพิ่มในเวอร์ชันถัดไป:\n- ดูรายชื่อผู้ใช้ทั้งหมด\n- แก้ไขข้อมูลผู้ใช้\n- เปิด/ปิดการใช้งาน\n- รีเซ็ตรหัสผ่าน');
            },

            showTransactions() {
                alert('ฟีเจอร์ "รายการทั้งหมด" กำลังพัฒนา\n\nจะเพิ่มในเวอร์ชันถัดไป:\n- ดูรายการทั้งหมด\n- กรองตามผู้ใช้\n- ส่งออกรายงาน\n- แก้ไข/ลบรายการ');
            },

            showProducts() {
                alert('ฟีเจอร์ "สินค้าทั้งหมด" กำลังพัฒนา\n\nจะเพิ่มในเวอร์ชันถัดไป:\n- ดูสินค้าทั้งหมด\n- กรองตามผู้ใช้\n- ส่งออกรายงานต้นทุน\n- สถิติสินค้า');
            },

            manageNews() {
                alert('ฟีเจอร์ "จัดการข่าวสาร" กำลังพัฒนา\n\nจะเพิ่มในเวอร์ชันถัดไป:\n- เพิ่ม/แก้ไข/ลบข่าว\n- เผยแพร่/ซ่อนข่าว\n- จัดลำดับข่าว\n- ตั้งเวลาแสดงข่าว');
            },

            async refresh() {
                await this.loadData();
                alert('รีเฟรชข้อมูลเรียบร้อย');
            },

            logout() {
                if (confirm('ต้องการออกจากระบบ?')) {
                    localStorage.removeItem('surat_otop_admin');
                    window.location.href = 'admin.html';
                }
            },

            showLoading() {
                document.getElementById('loading-overlay').classList.remove('hidden');
            },

            hideLoading() {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        };

        // เริ่มต้นเมื่อหน้าโหลดเสร็จ
        document.addEventListener('DOMContentLoaded', () => {
            AdminDashboard.init();
        });
    </script>
</body>
</html>
