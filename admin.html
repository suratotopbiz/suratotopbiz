<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Surat OTOP Biz</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Login Container -->
  <div class="w-full max-w-md">

    <!-- Login Card -->
    <div class="bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-700">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-br from-red-600 to-pink-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Admin Panel</h1>
        <p class="text-gray-400">ระบบจัดการสำหรับผู้ดูแล</p>
      </div>

      <!-- Login Form -->
      <form id="admin-login-form" class="space-y-5">

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">
            ชื่อผู้ใช้ <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <input
              type="text"
              id="username"
              placeholder="admin"
              autocomplete="username"
              class="w-full pl-10 pr-4 py-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:border-red-500 focus:ring-2 focus:ring-red-500 focus:ring-opacity-50 transition"
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">
            รหัสผ่าน <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full pl-10 pr-4 py-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:border-red-500 focus:ring-2 focus:ring-red-500 focus:ring-opacity-50 transition"
              required
            >
          </div>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-semibold py-4 rounded-xl transition duration-300 shadow-lg hover:shadow-xl transform hover:scale-105 flex items-center justify-center"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
          </svg>
          เข้าสู่ระบบ Admin
        </button>
      </form>

      <!-- Back Link -->
      <div class="mt-6 text-center">
        <a href="index.html" class="text-gray-400 hover:text-white text-sm inline-flex items-center transition group">
          <svg class="w-4 h-4 mr-1 group-hover:-translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          กลับหน้าหลัก
        </a>
      </div>
    </div>

    <!-- Info Box -->
    <div class="mt-6 bg-gray-800 bg-opacity-50 rounded-xl p-4 border border-gray-700 text-center">
      <p class="text-gray-400 text-sm">⚠️ สำหรับผู้ดูแลระบบเท่านั้น</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const ADMIN_STORAGE_KEY = 'surat_otop_admin';

    function saveAdminSession_(payload) {
      // payload = result.data จาก backend
      const adminSession = {
        adminId: payload.adminId || '',    // ✅ สำคัญ: dashboard ต้องใช้
        username: payload.username || '',
        role: payload.role || 'Admin',
        loginTime: new Date().toISOString()
      };
      localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(adminSession));
      return adminSession;
    }

    function getAdminSession_() {
      const raw = localStorage.getItem(ADMIN_STORAGE_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    // ✅ Admin Login
    document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        alert('❌ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
        return;
      }

      try {
        console.log('🔐 Admin login attempt:', username);

        if (typeof Utils !== 'undefined' && Utils.showLoading) {
          Utils.showLoading('กำลังเข้าสู่ระบบ...');
        }

        const result = await API.adminLogin(username, password);

        if (typeof Utils !== 'undefined' && Utils.hideLoading) {
          Utils.hideLoading();
        }

        if (result && result.success && result.data) {
          const admin = saveAdminSession_(result.data);

          // กันกรณี adminId ว่าง (ควรมีจาก backend)
          if (!admin.adminId) {
            console.warn('⚠️ adminId is empty. Please check Admins sheet column "admin_id".');
          }

          alert('✅ เข้าสู่ระบบสำเร็จ!');
          window.location.href = 'admin-dashboard.html';
          return;
        }

        alert('❌ เข้าสู่ระบบไม่สำเร็จ: ' + (result?.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'));
      } catch (error) {
        console.error('❌ Admin login error:', error);

        if (typeof Utils !== 'undefined' && Utils.hideLoading) {
          Utils.hideLoading();
        }

        alert('❌ เกิดข้อผิดพลาด: ' + (error?.message || error));
      }
    });

    // ✅ UX: Enter key behavior
    document.getElementById('username').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('password').focus();
      }
    });

    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        // form submit จะถูกเรียกโดย default อยู่แล้ว
      }
    });

    // ✅ ถ้ามี session อยู่แล้ว ให้ redirect ไป dashboard ได้เลย (เปิดใช้ได้ตามต้องการ)
    window.addEventListener('DOMContentLoaded', function () {
      const admin = getAdminSession_();
      if (admin && admin.username) {
        console.log('Found admin session:', admin.username);
        // ถ้าต้องการ auto redirect ให้เอา comment ออก
        // window.location.href = 'admin-dashboard.html';
      }
    });
  </script>
</body>
</html>
