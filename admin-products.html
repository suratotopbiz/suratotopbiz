<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สินค้าทั้งหมด - Admin | Surat OTOP Biz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body{font-family:'Prompt',sans-serif;} </style>
</head>
<body class="bg-gray-50">

<header class="bg-gradient-to-r from-slate-800 to-slate-900 text-white shadow-xl">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="admin-dashboard.html" class="p-2 hover:bg-white/10 rounded-lg">←</a>
      <div>
        <div class="text-lg font-bold">สินค้าทั้งหมด</div>
        <div class="text-sm text-slate-300">Admin Panel</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-xs text-slate-300">ผู้ดูแลระบบ</div>
      <div class="font-medium" id="admin-name">Admin</div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div class="bg-white rounded-2xl shadow p-5">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="md:col-span-2">
        <div class="text-sm text-gray-600 mb-2">ค้นหา (ชื่อสินค้า / userId)</div>
        <input id="q" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring"
               placeholder="เช่น น้ำชาเขียว หรือ OTOP001"/>
      </div>
      <div>
        <div class="text-sm text-gray-600 mb-2">เรียง</div>
        <select id="sort" class="w-full px-4 py-3 border rounded-xl">
          <option value="new">ใหม่ล่าสุด</option>
          <option value="price">ราคาขายแนะนำ (มาก→น้อย)</option>
        </select>
      </div>
      <div class="flex items-end gap-3">
        <button id="btn-refresh" class="w-full px-4 py-3 rounded-xl bg-slate-800 text-white hover:bg-slate-900">
          รีเฟรช
        </button>
      </div>
    </div>

    <div class="mt-5 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500 border-b">
            <th class="py-3 pr-4">Costing ID</th>
            <th class="py-3 pr-4">User ID</th>
            <th class="py-3 pr-4">ชื่อสินค้า</th>
            <th class="py-3 pr-4 text-right">ต้นทุน/หน่วย</th>
            <th class="py-3 pr-4 text-right">ราคาขายแนะนำ</th>
            <th class="py-3 pr-4">วันที่สร้าง</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="py-10 text-center text-gray-400">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 flex items-center justify-between text-sm text-gray-600">
      <div id="count">0 รายการ</div>
      <div class="flex items-center gap-2">
        <span>แสดง</span>
        <select id="limit" class="border rounded-lg px-2 py-1">
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="2000">2000</option>
        </select>
        <span>รายการ</span>
      </div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const KEY='surat_otop_admin';

const Page = {
  admin:null,
  items:[],

  requireAuth(){
    const raw=localStorage.getItem(KEY);
    if(!raw){location.href='admin.html';return false;}
    try{this.admin=JSON.parse(raw);}catch{localStorage.removeItem(KEY);location.href='admin.html';return false;}
    if(!this.admin?.adminId){localStorage.removeItem(KEY);location.href='admin.html';return false;}
    document.getElementById('admin-name').textContent=this.admin.username||'Admin';
    return true;
  },

  fmtDate(d){
    if(!d) return '';
    const dt = new Date(d);
    if(Number.isNaN(dt.getTime())) return '';
    return dt.toLocaleDateString('th-TH');
  },

  filterAndSort(){
    const q=document.getElementById('q').value.trim().toLowerCase();
    const sort=document.getElementById('sort').value;

    let list=this.items;
    if(q){
      list=list.filter(x=>{
        const hay=[x.costingId,x.userId,x.productName].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
    }

    if(sort==='price'){
      list=[...list].sort((a,b)=>Number(b.recommendedPrice||0)-Number(a.recommendedPrice||0));
    } else {
      // backend ส่งใหม่ล่าสุดอยู่แล้วโดยทั่วไป แต่กันไว้
      list=[...list].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    }
    return list;
  },

  render(){
    const rows=document.getElementById('rows');
    const list=this.filterAndSort();
    document.getElementById('count').textContent=`${list.length.toLocaleString('th-TH')} รายการ`;

    if(!list.length){
      rows.innerHTML=`<tr><td colspan="6" class="py-10 text-center text-gray-400">ไม่พบข้อมูล</td></tr>`;
      return;
    }

    rows.innerHTML=list.map(p=>{
      const cpu=Number(p.totalCostPerUnit||p.costPerUnit||0);
      const rp=Number(p.recommendedPrice||0);
      return `
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 pr-4 font-medium text-slate-900">${p.costingId||''}</td>
          <td class="py-3 pr-4">${p.userId||''}</td>
          <td class="py-3 pr-4">
            <div class="font-medium text-gray-800">${p.productName||''}</div>
            <div class="text-xs text-gray-500">ปริมาณผลิต: ${Number(p.productionVolume||0).toLocaleString('th-TH')}</div>
          </td>
          <td class="py-3 pr-4 text-right font-semibold">฿${cpu.toLocaleString('th-TH')}</td>
          <td class="py-3 pr-4 text-right font-bold text-emerald-700">฿${rp.toLocaleString('th-TH')}</td>
          <td class="py-3 pr-4">${this.fmtDate(p.createdAt)}</td>
        </tr>
      `;
    }).join('');
  },

  async load(){
    const limit=Number(document.getElementById('limit').value||500);
    const res=await API.getAdminAllProducts(this.admin.adminId, limit);
    if(res.success && res.data){ this.items=res.data; } else { this.items=[]; console.error(res.error); }
    this.render();
  }
};

document.addEventListener('DOMContentLoaded', async ()=>{
  if(!Page.requireAuth()) return;
  document.getElementById('btn-refresh').addEventListener('click', ()=>Page.load());
  document.getElementById('q').addEventListener('input', ()=>Page.render());
  document.getElementById('sort').addEventListener('change', ()=>Page.render());
  document.getElementById('limit').addEventListener('change', ()=>Page.load());
  await Page.load();
});
</script>
</body>
</html>
