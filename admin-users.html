<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>จัดการผู้ใช้ - Admin | Surat OTOP Biz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body{font-family:'Prompt',sans-serif;} </style>
</head>
<body class="bg-gray-50">

<header class="bg-gradient-to-r from-slate-800 to-slate-900 text-white shadow-xl">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="admin-dashboard.html" class="p-2 hover:bg-white/10 rounded-lg">←</a>
      <div>
        <div class="text-lg font-bold">จัดการผู้ใช้</div>
        <div class="text-sm text-slate-300">Admin Panel</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-xs text-slate-300">ผู้ดูแลระบบ</div>
      <div class="font-medium" id="admin-name">Admin</div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div class="bg-white rounded-2xl shadow p-5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex-1">
        <div class="text-sm text-gray-600 mb-2">ค้นหา (ชื่อ / เบอร์ / userId)</div>
        <input id="q" type="text" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring"
               placeholder="เช่น OTOP001 หรือ 0812345678 หรือ สมหญิง"/>
      </div>
      <div class="flex gap-3">
        <button id="btn-refresh" class="px-4 py-3 rounded-xl bg-slate-800 text-white hover:bg-slate-900">
          รีเฟรช
        </button>
      </div>
    </div>

    <div class="mt-5 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500 border-b">
            <th class="py-3 pr-4">User ID</th>
            <th class="py-3 pr-4">ชื่อผู้ประกอบการ</th>
            <th class="py-3 pr-4">เบอร์</th>
            <th class="py-3 pr-4">อำเภอ</th>
            <th class="py-3 pr-4">สถานะ</th>
            <th class="py-3 pr-4 text-right">จัดการ</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="py-10 text-center text-gray-400">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 flex items-center justify-between text-sm text-gray-600">
      <div id="count">0 รายการ</div>
      <div class="flex items-center gap-2">
        <span>แสดง</span>
        <select id="limit" class="border rounded-lg px-2 py-1">
          <option value="50">50</option>
          <option value="200">200</option>
          <option value="500">500</option>
          <option value="2000">2000</option>
        </select>
        <span>รายการ</span>
      </div>
    </div>
  </div>
</main>

<div id="loading" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-6 flex items-center gap-3">
    <div class="animate-spin w-6 h-6 border-2 border-slate-400 border-t-transparent rounded-full"></div>
    <div class="text-gray-700">กำลังทำรายการ...</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const KEY = 'surat_otop_admin';

const Page = {
  admin: null,
  users: [],

  showLoading(on){ document.getElementById('loading').classList.toggle('hidden', !on); },

  requireAuth(){
    const raw = localStorage.getItem(KEY);
    if(!raw){ location.href='admin.html'; return false; }
    try{ this.admin = JSON.parse(raw); } catch { localStorage.removeItem(KEY); location.href='admin.html'; return false; }
    if(!this.admin?.adminId){ localStorage.removeItem(KEY); location.href='admin.html'; return false; }
    document.getElementById('admin-name').textContent = this.admin.username || 'Admin';
    return true;
  },

  badge(status){
    const s = (status||'').toLowerCase();
    const active = s === 'active';
    return `<span class="text-xs px-2 py-1 rounded-full ${active?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}">
      ${active?'Active':(status||'Ban')}
    </span>`;
  },

  filter(){
    const q = document.getElementById('q').value.trim().toLowerCase();
    if(!q) return this.users;
    return this.users.filter(u => {
      const hay = [
        u.userId, u.entrepreneursName, u.chairmanOwnerName, u.phone, u.district, u.status
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  },

  render(){
    const rows = document.getElementById('rows');
    const list = this.filter();
    document.getElementById('count').textContent = `${list.length.toLocaleString('th-TH')} รายการ`;

    if(!list.length){
      rows.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-gray-400">ไม่พบข้อมูล</td></tr>`;
      return;
    }

    rows.innerHTML = list.map(u => {
      const name = u.entrepreneursName || u.chairmanOwnerName || 'ไม่ระบุชื่อ';
      const status = u.status || 'Active';
      const isActive = (status||'').toLowerCase() === 'active';
      return `
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 pr-4 font-medium text-slate-900">${u.userId || ''}</td>
          <td class="py-3 pr-4">
            <div class="font-medium text-gray-800">${name}</div>
            <div class="text-xs text-gray-500">${u.operatingModel || ''}</div>
          </td>
          <td class="py-3 pr-4">${u.phone || ''}</td>
          <td class="py-3 pr-4">${u.district || ''}</td>
          <td class="py-3 pr-4">${this.badge(status)}</td>
          <td class="py-3 pr-2 text-right">
            <button class="px-3 py-2 rounded-lg ${isActive?'bg-red-600 hover:bg-red-700':'bg-emerald-600 hover:bg-emerald-700'} text-white text-xs"
              onclick="Page.toggleStatus('${u.userId}','${isActive?'Ban':'Active'}')">
              ${isActive?'แบน':'ปลดแบน'}
            </button>
          </td>
        </tr>
      `;
    }).join('');
  },

  async load(){
    const limit = Number(document.getElementById('limit').value || 200);
    const res = await API.getAdminUsers(this.admin.adminId, limit);
    if(res.success && res.data){
      this.users = res.data;
    } else {
      this.users = [];
      console.error(res.error);
    }
    this.render();
  },

  async toggleStatus(userId, status){
    if(!confirm(`ยืนยันเปลี่ยนสถานะ ${userId} เป็น ${status}?`)) return;
    this.showLoading(true);
    try{
      const res = await API.adminUpdateUserStatus(this.admin.adminId, userId, status);
      if(res.success){
        // update local list
        this.users = this.users.map(u => u.userId === userId ? ({...u, status}) : u);
        this.render();
        alert('อัปเดตสำเร็จ');
      } else {
        alert('อัปเดตไม่สำเร็จ: ' + (res.error || ''));
      }
    } finally {
      this.showLoading(false);
    }
  }
};

document.addEventListener('DOMContentLoaded', async () => {
  if(!Page.requireAuth()) return;
  document.getElementById('btn-refresh').addEventListener('click', () => Page.load());
  document.getElementById('q').addEventListener('input', () => Page.render());
  document.getElementById('limit').addEventListener('change', () => Page.load());
  await Page.load();
});
</script>
</body>
</html>
