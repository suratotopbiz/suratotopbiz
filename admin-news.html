<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>จัดการข่าวสาร - Admin | Surat OTOP Biz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body{font-family:'Prompt',sans-serif;} </style>
</head>
<body class="bg-gray-50">

<header class="bg-gradient-to-r from-slate-800 to-slate-900 text-white shadow-xl">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="admin-dashboard.html" class="p-2 hover:bg-white/10 rounded-lg">←</a>
      <div>
        <div class="text-lg font-bold">จัดการข่าวสาร</div>
        <div class="text-sm text-slate-300">Admin Panel</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-xs text-slate-300">ผู้ดูแลระบบ</div>
      <div class="font-medium" id="admin-name">Admin</div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div class="bg-white rounded-2xl shadow p-5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex-1">
        <div class="text-sm text-gray-600 mb-2">ค้นหา (หัวข้อ/เนื้อหา)</div>
        <input id="q" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring"
               placeholder="พิมพ์คำค้นหา..."/>
      </div>
      <div class="flex gap-3">
        <button id="btn-new" class="px-4 py-3 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700">
          + เพิ่มข่าว
        </button>
        <button id="btn-refresh" class="px-4 py-3 rounded-xl bg-slate-800 text-white hover:bg-slate-900">
          รีเฟรช
        </button>
      </div>
    </div>

    <div class="mt-5 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500 border-b">
            <th class="py-3 pr-4">หัวข้อ</th>
            <th class="py-3 pr-4">วันที่</th>
            <th class="py-3 pr-4">สถานะ</th>
            <th class="py-3 pr-2 text-right">จัดการ</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="4" class="py-10 text-center text-gray-400">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 text-sm text-gray-600" id="count">0 รายการ</div>
  </div>
</main>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl p-6">
    <div class="flex items-center justify-between mb-4">
      <div class="text-lg font-bold" id="modal-title">เพิ่มข่าว</div>
      <button class="p-2 rounded-lg hover:bg-gray-100" onclick="Page.closeModal()">✕</button>
    </div>

    <div class="space-y-4">
      <div>
        <div class="text-sm text-gray-600 mb-2">หัวข้อ</div>
        <input id="f-title" class="w-full px-4 py-3 border rounded-xl" placeholder="หัวข้อข่าว...">
      </div>
      <div>
        <div class="text-sm text-gray-600 mb-2">เนื้อหา</div>
        <textarea id="f-content" rows="6" class="w-full px-4 py-3 border rounded-xl" placeholder="รายละเอียดข่าว..."></textarea>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <div class="text-sm text-gray-600 mb-2">วันที่</div>
          <input id="f-date" type="date" class="w-full px-4 py-3 border rounded-xl">
        </div>
        <div>
          <div class="text-sm text-gray-600 mb-2">สถานะ</div>
          <select id="f-status" class="w-full px-4 py-3 border rounded-xl">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button class="px-4 py-3 rounded-xl bg-gray-100 hover:bg-gray-200" onclick="Page.closeModal()">ยกเลิก</button>
      <button id="btn-save" class="px-4 py-3 rounded-xl bg-slate-800 text-white hover:bg-slate-900">บันทึก</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const KEY='surat_otop_admin';

const Page = {
  admin:null,
  list:[],
  editingId:null,

  requireAuth(){
    const raw=localStorage.getItem(KEY);
    if(!raw){location.href='admin.html';return false;}
    try{this.admin=JSON.parse(raw);}catch{localStorage.removeItem(KEY);location.href='admin.html';return false;}
    if(!this.admin?.adminId){localStorage.removeItem(KEY);location.href='admin.html';return false;}
    document.getElementById('admin-name').textContent=this.admin.username||'Admin';
    return true;
  },

  openModal(item=null){
    this.editingId = item?.newsId || null;
    document.getElementById('modal-title').textContent = this.editingId ? 'แก้ไขข่าว' : 'เพิ่มข่าว';
    document.getElementById('f-title').value = item?.title || '';
    document.getElementById('f-content').value = item?.content || '';
    const d = item?.date ? new Date(item.date) : new Date();
    document.getElementById('f-date').value = d.toISOString().slice(0,10);
    document.getElementById('f-status').value = item?.status || 'Active';
    document.getElementById('modal').classList.remove('hidden');
  },

  closeModal(){
    document.getElementById('modal').classList.add('hidden');
  },

  badge(status){
    const s=(status||'').toLowerCase();
    const active = s==='active';
    return `<span class="text-xs px-2 py-1 rounded-full ${active?'bg-emerald-100 text-emerald-700':'bg-gray-100 text-gray-700'}">
      ${active?'Active':'Inactive'}
    </span>`;
  },

  filter(){
    const q=document.getElementById('q').value.trim().toLowerCase();
    if(!q) return this.list;
    return this.list.filter(n=>{
      const hay=[n.title,n.content].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  },

  render(){
    const rows=document.getElementById('rows');
    const list=this.filter();
    document.getElementById('count').textContent = `${list.length.toLocaleString('th-TH')} รายการ`;

    if(!list.length){
      rows.innerHTML=`<tr><td colspan="4" class="py-10 text-center text-gray-400">ไม่พบข้อมูล</td></tr>`;
      return;
    }

    rows.innerHTML=list.map(n=>{
      const dt = n.date ? new Date(n.date) : null;
      const dstr = dt && !Number.isNaN(dt.getTime()) ? dt.toLocaleDateString('th-TH') : '';
      return `
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 pr-4">
            <div class="font-medium text-gray-800">${n.title||''}</div>
            <div class="text-xs text-gray-500 line-clamp-1">${(n.content||'').slice(0,120)}</div>
          </td>
          <td class="py-3 pr-4">${dstr}</td>
          <td class="py-3 pr-4">${this.badge(n.status)}</td>
          <td class="py-3 pr-2 text-right">
            <button class="px-3 py-2 text-xs rounded-lg bg-blue-600 text-white hover:bg-blue-700"
              onclick='Page.openModal(${JSON.stringify(n)})'>แก้ไข</button>
            <button class="px-3 py-2 text-xs rounded-lg bg-red-600 text-white hover:bg-red-700"
              onclick="Page.remove('${n.newsId}')">ลบ</button>
          </td>
        </tr>
      `;
    }).join('');
  },

  async load(){
    // ต้องมี backend route: admin-news-list
    const res = await API.adminNewsList(this.admin.adminId);
    if(res.success && res.data){ this.list = res.data; } else { this.list=[]; console.error(res.error); }
    this.render();
  },

  async save(){
    const title = document.getElementById('f-title').value.trim();
    const content = document.getElementById('f-content').value.trim();
    const date = document.getElementById('f-date').value;
    const status = document.getElementById('f-status').value;

    if(!title){ alert('กรุณากรอกหัวข้อ'); return; }
    if(!content){ alert('กรุณากรอกเนื้อหา'); return; }

    const payload = {
      newsId: this.editingId, // null = add
      title, content, date, status
    };

    const res = await API.adminNewsUpsert(this.admin.adminId, payload);
    if(res.success){
      this.closeModal();
      await this.load();
      alert('บันทึกสำเร็จ');
    } else {
      alert('บันทึกไม่สำเร็จ: ' + (res.error||''));
    }
  },

  async remove(newsId){
    if(!confirm('ยืนยันลบข่าวนี้?')) return;
    const res = await API.adminNewsDelete(this.admin.adminId, newsId);
    if(res.success){
      await this.load();
      alert('ลบสำเร็จ');
    } else {
      alert('ลบไม่สำเร็จ: ' + (res.error||''));
    }
  }
};

document.addEventListener('DOMContentLoaded', async ()=>{
  if(!Page.requireAuth()) return;
  document.getElementById('btn-refresh').addEventListener('click', ()=>Page.load());
  document.getElementById('q').addEventListener('input', ()=>Page.render());
  document.getElementById('btn-new').addEventListener('click', ()=>Page.openModal(null));
  document.getElementById('btn-save').addEventListener('click', ()=>Page.save());
  await Page.load();
});
</script>
</body>
</html>
